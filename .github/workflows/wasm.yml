name: Build WebAssembly (for self-hosting)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Emscripten SDK (Qt 5.15.2 benötigt exakt 1.39.8) ──────────────
      - name: Install Emscripten 1.39.8
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.8
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc --version


      - name: Setup and embed default ROM files from GitHub Release
        run: |
          # ═══════════════════════════════════════════════════════════════
          # 1. ROM-Dateien von GitHub Release herunterladen
          # ═══════════════════════════════════════════════════════════════
          mkdir -p default_roms
          
          RELEASE_TAG="roms-v1.0"
          REPO="${{ github.repository }}"
          
          echo "📦 Downloading ROM files from release ${RELEASE_TAG}..."
          
          download_file() {
            local remote_name=$1
            local local_name=$2
            local url="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${remote_name}"
            
            if curl -f -L  \
              -o "default_roms/${local_name}" "${url}" 2>/dev/null; then
              echo "  ✓ ${remote_name} → ${local_name} ($(du -h default_roms/${local_name} | cut -f1))"
              return 0
            else
              echo "  ✗ ${remote_name} nicht gefunden"
              return 1
            fi
          }
          
          SUCCESS=true
          download_file "boot1.img.tns" "boot1.img" || SUCCESS=false
          download_file "flash" "flash.img" || SUCCESS=false
          download_file "snap" "snapshot.img.tns" || SUCCESS=false
          
          if [ "$SUCCESS" = false ]; then
            echo ""
            echo "⚠️  WARNUNG: ROM-Dateien konnten nicht geladen werden!"
            echo "   App wird OHNE embedded ROMs gebaut."
            touch default_roms/boot1.img default_roms/flash.img default_roms/snapshot.img.tns
            ROMS_AVAILABLE=false
          else
            echo ""
            echo "✓ Alle ROM-Dateien erfolgreich geladen!"
            ls -lh default_roms/
            ROMS_AVAILABLE=true
          fi
          
          # ═══════════════════════════════════════════════════════════════
          # 2. Füge ROM-Dateien zu resources.qrc hinzu
          # ═══════════════════════════════════════════════════════════════
          echo ""
          echo "📝 Patching resources.qrc..."
          
          sed -i.bak '/<\/qresource>/d; /<\/RCC>/d' resources.qrc
          
          cat >> resources.qrc << 'EOF'
              <!-- Embedded default ROM files -->
              <file>default_roms/boot1.img</file>
              <file>default_roms/flash.img</file>
              <file>default_roms/snapshot.img.tns</file>
          </qresource>
          </RCC>
          EOF
          
          echo "  ✓ resources.qrc aktualisiert"
          
          # ═══════════════════════════════════════════════════════════════
          # 3. Füge Auto-Setup Code in main.cpp ein
          # ═══════════════════════════════════════════════════════════════
          echo ""
          echo "📝 Patching main.cpp..."
          
          if grep -q "setupDefaultKitIfNeeded" main.cpp; then
            echo "  ℹ️  main.cpp bereits gepatcht, überspringe..."
          else
            sed -i.bak '/^#include.*mainwindow/a\
          \
          /* Auto-setup function for embedded default ROM files */\
          static bool setupDefaultKitIfNeeded(KitModel *model) {\
              if (model->rowCount() > 0) return true;\
              qDebug() << "No kits found, setting up default kit...";\
              QString dataDir = QStandardPaths::writableLocation(QStandardPaths::AppDataLocation);\
              QDir().mkpath(dataDir);\
              auto extractResource = [&](const QString& res, const QString& name) -> QString {\
                  QString target = dataDir + QLatin1String("/") + name;\
                  if (!QFile::exists(target)) {\
                      if (QFile::copy(res, target)) {\
                          QFile::setPermissions(target, QFileDevice::ReadOwner | QFileDevice::WriteOwner);\
                          qDebug() << "Extracted" << name << "to" << target;\
                      } else {\
                          qWarning() << "Failed to extract" << name;\
                          return QString();\
                      }\
                  }\
                  return target;\
              };\
              QString boot1 = extractResource(QLatin1String(":/default_roms/boot1.img"), QLatin1String("default_boot1.img"));\
              QString flash = extractResource(QLatin1String(":/default_roms/flash.img"), QLatin1String("default_flash.img"));\
              QString snapshot = extractResource(QLatin1String(":/default_roms/snapshot.img.tns"), QLatin1String("default_snapshot.img.tns"));\
              if (boot1.isEmpty() || flash.isEmpty() || snapshot.isEmpty()) {\
                  qWarning() << "Failed to setup default kit";\
                  return false;\
              }\
              model->addKit(QLatin1String("Default Calculator"), boot1, flash, snapshot);\
              qDebug() << "Default kit created!";\
              return true;\
          }
          ' main.cpp
            
            sed -i.bak 's/\(kit_model\.load();\)/\1\n    setupDefaultKitIfNeeded(\&kit_model);/' main.cpp
            
            echo "  ✓ main.cpp gepatcht"
          fi
          
          # ═══════════════════════════════════════════════════════════════
          # 4. Patche qmlbridge.cpp (für Mobile UI)
          # ═══════════════════════════════════════════════════════════════
          if [ -f qmlbridge.cpp ]; then
            echo ""
            echo "📝 Patching qmlbridge.cpp..."
            
            if grep -q "setupDefaultKitIfNeeded" qmlbridge.cpp; then
              echo "  ℹ️  qmlbridge.cpp bereits gepatcht, überspringe..."
            else
              sed -i.bak '/^#include.*qmlbridge/a\
          \
          /* Auto-setup function for embedded default ROM files */\
          static bool setupDefaultKitIfNeeded(KitModel *model) {\
              if (model->rowCount() > 0) return true;\
              QString dataDir = QStandardPaths::writableLocation(QStandardPaths::AppDataLocation);\
              QDir().mkpath(dataDir);\
              auto extractResource = [&](const QString& res, const QString& name) -> QString {\
                  QString target = dataDir + QLatin1String("/") + name;\
                  if (!QFile::exists(target)) {\
                      if (QFile::copy(res, target)) {\
                          QFile::setPermissions(target, QFileDevice::ReadOwner | QFileDevice::WriteOwner);\
                      }\
                  }\
                  return target;\
              };\
              QString boot1 = extractResource(QLatin1String(":/default_roms/boot1.img"), QLatin1String("default_boot1.img"));\
              QString flash = extractResource(QLatin1String(":/default_roms/flash.img"), QLatin1String("default_flash.img"));\
              QString snapshot = extractResource(QLatin1String(":/default_roms/snapshot.img.tns"), QLatin1String("default_snapshot.img.tns"));\
              if (boot1.isEmpty() || flash.isEmpty() || snapshot.isEmpty()) return false;\
              model->addKit(QLatin1String("Default Calculator"), boot1, flash, snapshot);\
              return true;\
          }
          ' qmlbridge.cpp
              
              sed -i.bak 's/\(kit_model\.load();\)/\1\n    setupDefaultKitIfNeeded(\&kit_model);/' qmlbridge.cpp
              
              echo "  ✓ qmlbridge.cpp gepatcht"
            fi
          fi
          
          # ═══════════════════════════════════════════════════════════════
          # 5. Status
          # ═══════════════════════════════════════════════════════════════
          echo ""
          echo "════════════════════════════════════════════════════════"
          if [ "$ROMS_AVAILABLE" = true ]; then
            echo "✅ ROM-Setup erfolgreich!"
          else
            echo "⚠️  ROM-Setup übersprungen!"
          fi
          echo "════════════════════════════════════════════════════════"

      # ── 3. Qt 5.15.2 für WebAssembly ──────────────────────────────────────
      - name: Install aqtinstall
        run: pipx install aqtinstall

      - name: Install Qt 5 – Linux host tools (qmake, moc, rcc)
        run: aqt install-qt linux desktop 5.15.2 gcc_64 --outputdir $HOME/Qt

      - name: Install Qt 5 – WebAssembly target
        run: aqt install-qt linux desktop 5.15.2 wasm_32 --outputdir $HOME/Qt

      - name: Export Qt paths
        run: |
          echo "QT_HOST=$HOME/Qt/5.15.2/gcc_64"      >> $GITHUB_ENV
          echo "QT_WASM=$HOME/Qt/5.15.2/wasm_32"     >> $GITHUB_ENV
          echo "$HOME/Qt/5.15.2/gcc_64/bin"           >> $GITHUB_PATH

      # ── 3.5. Patch source code for WASM compatibility ──────────────────────
      - name: Patch code – disable QThread::setTerminationEnabled for WASM
        run: |
          # Diese Funktion existiert nicht in Qt WASM
          find . -name "*.cpp" -o -name "*.h" | xargs grep -l "setTerminationEnabled" | while read file; do
            sed -i 's/\(.*setTerminationEnabled.*\)/#ifndef __EMSCRIPTEN__\n\1\n#endif/' "$file"
          done
          echo "Patched files for WASM compatibility"

      # ── 4. Build ──────────────────────────────────────────────────────────
      - name: Run qmake (WebAssembly)
        run: |
          mkdir build-wasm && cd build-wasm
          $QT_WASM/bin/qmake .. \
            -spec wasm-emscripten \
            "CONFIG+=release" \
            "TRANSLATION_ENABLED=false" \
            "QMAKE_CFLAGS+=-s USE_ZLIB=1" \
            "QMAKE_CXXFLAGS+=-s USE_ZLIB=1" \
            "QMAKE_LFLAGS+=-s USE_ZLIB=1"

      - name: Patch Makefile – fix missing -s prefix on Emscripten linker flags
        working-directory: build-wasm
        run: |
          sed -i \
            -e 's/\bWASM=1\b/-s WASM=1/g' \
            -e 's/\bFULL_ES2=1\b/-s FULL_ES2=1/g' \
            -e 's/\bFULL_ES3=1\b/-s FULL_ES3=1/g' \
            -e 's/\bUSE_WEBGL2=1\b/-s USE_WEBGL2=1/g' \
            -e 's/\bEXIT_RUNTIME=1\b/-s EXIT_RUNTIME=1/g' \
            -e 's/\bERROR_ON_UNDEFINED_SYMBOLS=1\b/-s ERROR_ON_UNDEFINED_SYMBOLS=1/g' \
            -e 's/\bEXTRA_EXPORTED_RUNTIME_METHODS=\[/-s EXTRA_EXPORTED_RUNTIME_METHODS=[/g' \
            -e 's/\bFETCH=1\b/-s FETCH=1/g' \
            Makefile
          echo "Makefile gepatcht"

      - name: Build
        working-directory: build-wasm
        run: make -j$(nproc)

      # ── 5. Package für Self-Hosting ───────────────────────────────────────
      - name: Create deployment package
        run: |
          mkdir -p deploy
          
          # Hauptdateien
          cp build-wasm/firebird-emu.html   deploy/index.html   || \
          cp build-wasm/firebird.html       deploy/index.html
          cp build-wasm/*.js                deploy/
          cp build-wasm/*.wasm              deploy/
          
          # Optionale Dateien
          cp build-wasm/*.data              deploy/ 2>/dev/null || true
          cp build-wasm/*.worker.js         deploy/ 2>/dev/null || true

          # Service Worker für Server ohne COOP/COEP Header
          cat > deploy/coi-serviceworker.js << 'EOF'
          /* coi-serviceworker v0.1.7 – for servers without COOP/COEP headers */
          self.addEventListener("install",()=>self.skipWaiting());
          self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
          self.addEventListener("fetch",e=>{
            if(e.request.cache==="only-if-cached"&&e.request.mode!=="same-origin")return;
            e.respondWith(
              fetch(e.request).then(r=>{
                if(r.status===0)return r;
                const h=new Headers(r.headers);
                h.set("Cross-Origin-Opener-Policy","same-origin");
                h.set("Cross-Origin-Embedder-Policy","require-corp");
                return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h});
              })
            );
          });
          EOF

          # Service Worker aktivieren
          sed -i 's|<head>|<head>\n<script>if(!crossOriginIsolated){const r=new Promise(res=>navigator.serviceWorker.register("coi-serviceworker.js").then(res,res));if(!navigator.serviceWorker.controller)r.then(()=>location.reload());}</script>|' deploy/index.html

          # README mit Anweisungen
          cat > deploy/README.txt << 'EOF'
          FIREBIRD WEBASSEMBLY BUILD
          ==========================

          INSTALLATION:
          1. Lade alle Dateien auf deinen Webserver hoch
          2. Stelle sicher, dass dein Server folgende Header setzt:
             Cross-Origin-Opener-Policy: same-origin
             Cross-Origin-Embedder-Policy: require-corp

          WEBSERVER-KONFIGURATIONEN:

          Apache (.htaccess):
          -------------------
          <IfModule mod_headers.c>
              Header set Cross-Origin-Opener-Policy "same-origin"
              Header set Cross-Origin-Embedder-Policy "require-corp"
          </IfModule>

          Nginx:
          ------
          add_header Cross-Origin-Opener-Policy "same-origin";
          add_header Cross-Origin-Embedder-Policy "require-corp";

          Caddy:
          ------
          header {
              Cross-Origin-Opener-Policy "same-origin"
              Cross-Origin-Embedder-Policy "require-corp"
          }

          OHNE HEADER-KONFIGURATION:
          Der inkludierte coi-serviceworker.js setzt die Header 
          clientseitig (funktioniert bei den meisten Browsern).

          TESTEN:
          Öffne https://dein-server.de/pfad/index.html
          EOF

          echo "Deployment-Paket erstellt:"
          ls -lh deploy/

      # ── 6. Upload als Artifact ────────────────────────────────────────────
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: firebird-wasm-selfhost
          path: deploy/
          retention-days: 90
