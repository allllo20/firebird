name: Build WebAssembly (Emscripten)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        run: |
          emcc --version
          make --version

      - name: Download ROM files
        run: |
          mkdir -p roms
          cd roms
          wget -q https://github.com/allllo20/firebird/releases/download/roms-v1.0/boot1.img.tns
          wget -q https://github.com/allllo20/firebird/releases/download/roms-v1.0/flash
          wget -q https://github.com/allllo20/firebird/releases/download/roms-v1.0/snap

      - name: Build (non-Qt Emscripten target)
        working-directory: emscripten
        run: |
          make clean
          make -j"$(nproc)" LFLAGS="-s INITIAL_MEMORY=268435456 -s ALLOW_MEMORY_GROWTH=1 --preload-file ../roms@/roms"

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp emscripten/firebird.html deploy/index.html
          cp emscripten/firebird.js deploy/
          cp emscripten/firebird.wasm deploy/
          cp emscripten/firebird.data deploy/ 2>/dev/null || true
          cp icon.png deploy/ 2>/dev/null || true
          cp icon.png deploy/favicon.ico 2>/dev/null || true
          touch deploy/.nojekyll

          ls -lh deploy/

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: firebird-wasm-emscripten
          path: deploy/
          retention-days: 90

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
