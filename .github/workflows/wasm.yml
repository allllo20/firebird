name: Build for WebAssembly + Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Emscripten SDK (Qt 5.15.2 benötigt 1.39.8) ────────────────────
      - name: Install Emscripten 1.39.8
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.8
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc --version

      # ── 3. Qt 5.15.2 für WebAssembly ──────────────────────────────────────
      - name: Install aqtinstall
        run: pipx install aqtinstall

      - name: Install Qt 5 – Linux host tools (qmake, moc, rcc)
        run: aqt install-qt linux desktop 5.15.2 gcc_64 --outputdir $HOME/Qt

      - name: Install Qt 5 – WebAssembly target
        run: aqt install-qt linux desktop 5.15.2 wasm_32 --outputdir $HOME/Qt

      - name: Export Qt paths
        run: |
          echo "QT_HOST=$HOME/Qt/5.15.2/gcc_64"      >> $GITHUB_ENV
          echo "QT_WASM=$HOME/Qt/5.15.2/wasm_32"     >> $GITHUB_ENV
          echo "$HOME/Qt/5.15.2/gcc_64/bin"           >> $GITHUB_PATH

      # ── 4. Build ──────────────────────────────────────────────────────────
      - name: Run qmake (WebAssembly)
        run: |
          mkdir build-wasm && cd build-wasm
          $QT_WASM/bin/qmake .. \
            -spec wasm-emscripten \
            "CONFIG+=release" \
            "TRANSLATION_ENABLED=false"

      - name: Build
        working-directory: build-wasm
        run: make -j$(nproc)

      # ── 5. Ausgabe-Verzeichnis für Pages zusammenstellen ──────────────────
      - name: Assemble Pages directory
        run: |
          mkdir -p pages

          # Die von Qt WASM generierten Dateien
          if [ -f build-wasm/firebird-emu.html ]; then
            cp build-wasm/firebird-emu.html pages/index.html
          elif [ -f build-wasm/firebird.html ]; then
            cp build-wasm/firebird.html pages/index.html
          fi
          
          cp build-wasm/*.js                pages/ 2>/dev/null || true
          cp build-wasm/*.wasm              pages/ 2>/dev/null || true
          cp build-wasm/*.data              pages/ 2>/dev/null || true
          cp build-wasm/*.worker.js         pages/ 2>/dev/null || true

          # COOP/COEP Headers via Service Worker (nötig für SharedArrayBuffer)
          cat > pages/coi-serviceworker.js << 'EOF'
          /* coi-serviceworker v0.1.7 – makeshift crossOriginIsolated for GitHub Pages */
          self.addEventListener("install",()=>self.skipWaiting());
          self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
          self.addEventListener("fetch",e=>{
            if(e.request.cache==="only-if-cached"&&e.request.mode!=="same-origin")return;
            e.respondWith(
              fetch(e.request).then(r=>{
                if(r.status===0)return r;
                const h=new Headers(r.headers);
                h.set("Cross-Origin-Opener-Policy","same-origin");
                h.set("Cross-Origin-Embedder-Policy","require-corp");
                return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h});
              })
            );
          });
          EOF

          # Inject Service Worker registration into index.html
          sed -i 's|<head>|<head>\n<script>if(!crossOriginIsolated){const r=new Promise(res=>navigator.serviceWorker.register("coi-serviceworker.js").then(res,res));if(!navigator.serviceWorker.controller)r.then(()=>location.reload());}</script>|' pages/index.html

          echo "Pages content:"
          ls -lh pages/

      # ── 6. GitHub Pages Upload ────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
