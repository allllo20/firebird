name: Build for iOS (unsigned IPA)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:          # manuell auslösbar

jobs:
  build-ios:
    runs-on: macos-14         # Apple-Silicon-Runner mit Xcode 15+

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Xcode-Version fixieren ─────────────────────────────────────────
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 3. Qt 5 installieren (aqtinstall) ────────────────────────────────
      - name: Install Qt 5 via aqtinstall
        run: |
                pipx install aqtinstall
                aqt install-qt mac desktop 5.15.2 clang_64 --outputdir $HOME/Qt
                aqt install-qt mac ios     5.15.2 ios       --outputdir $HOME/Qt

      - name: Export Qt paths
        run: |
          echo "QT_IOS=$HOME/Qt/5.15.2/ios"  >> $GITHUB_ENV
          echo "$HOME/Qt/5.15.2/clang_64/bin" >> $GITHUB_PATH


      # ── 4. qmake für iOS ausführen ────────────────────────────────────────
      # TRANSLATION_ENABLED=false = kein JIT → umgeht den asmcode_arm.S-Bug
      # aus dem README. Für JIT: auf true setzen + xcodeproj-Workaround (s.u.)
           
      - name: Run qmake (iOS device, no JIT)
        run: |
          mkdir build-ios && cd build-ios
          $QT_IOS/bin/qmake .. \
            -spec macx-ios-clang \
            "CONFIG+=iphoneos device release" \
            "TRANSLATION_ENABLED=false" \
            "QMAKE_APPLE_DEVICE_ARCHS=arm64"

      - name: Patch xcodeproj – remove -mno-thumb
        working-directory: build-ios
        run: |
          sed -i '' 's/-mno-thumb//g' *.xcodeproj/project.pbxproj

      - name: Pre-generate qrc_resources.cpp   # ← neu
        working-directory: build-ios
        run: $QT_IOS/bin/rcc -name resources ../resources.qrc -o qrc_resources.cpp

      - name: Replace app icon with custom icon.png
        working-directory: build-ios
        run: |
          SRC="${GITHUB_WORKSPACE}/icon.png"
          
          # 1. Suche ALLE bestehenden AppIcon.appiconsets (auch im Projekt-Root)
          EXISTING=$(find "${GITHUB_WORKSPACE}" -name "AppIcon.appiconset" -not -path "*/build*" -not -path "*/.git/*")
          
          if [ -n "$EXISTING" ]; then
            # Verwende das erste gefundene und lösche dessen Inhalt
            APPICONSET=$(echo "$EXISTING" | head -n 1)
            echo "Verwende bestehendes Asset Catalog: $APPICONSET"
            rm -f "$APPICONSET"/*.png "$APPICONSET/Contents.json"
          else
            # Lege neues an
            echo "Kein Asset Catalog gefunden – lege neues an"
            APPICONSET="${GITHUB_WORKSPACE}/ios/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$APPICONSET"
          fi

          # 2. Alle Icon-Größen generieren
          declare -A SIZES=(
            ["Icon-20.png"]="20"
            ["Icon-20@2x.png"]="40"
            ["Icon-20@3x.png"]="60"
            ["Icon-29.png"]="29"
            ["Icon-29@2x.png"]="58"
            ["Icon-29@3x.png"]="87"
            ["Icon-40.png"]="40"
            ["Icon-40@2x.png"]="80"
            ["Icon-40@3x.png"]="120"
            ["Icon-60@2x.png"]="120"
            ["Icon-60@3x.png"]="180"
            ["Icon-76.png"]="76"
            ["Icon-76@2x.png"]="152"
            ["Icon-83.5@2x.png"]="167"
            ["Icon-1024.png"]="1024"
          )

          for FILENAME in "${!SIZES[@]}"; do
            SIZE="${SIZES[$FILENAME]}"
            sips -z "$SIZE" "$SIZE" "$SRC" --out "$APPICONSET/$FILENAME" > /dev/null
            echo "  ✓ $FILENAME (${SIZE}x${SIZE})"
          done

          # 3. Contents.json schreiben
          cat > "$APPICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {"idiom":"iphone","scale":"2x","size":"20x20","filename":"Icon-20@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"20x20","filename":"Icon-20@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"29x29","filename":"Icon-29@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"29x29","filename":"Icon-29@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"40x40","filename":"Icon-40@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"40x40","filename":"Icon-40@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"60x60","filename":"Icon-60@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"60x60","filename":"Icon-60@3x.png"},
              {"idiom":"ipad","scale":"1x","size":"20x20","filename":"Icon-20.png"},
              {"idiom":"ipad","scale":"2x","size":"20x20","filename":"Icon-20@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"29x29","filename":"Icon-29.png"},
              {"idiom":"ipad","scale":"2x","size":"29x29","filename":"Icon-29@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"40x40","filename":"Icon-40.png"},
              {"idiom":"ipad","scale":"2x","size":"40x40","filename":"Icon-40@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"76x76","filename":"Icon-76.png"},
              {"idiom":"ipad","scale":"2x","size":"76x76","filename":"Icon-76@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"Icon-83.5@2x.png"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"Icon-1024.png"}
            ],
            "info": {"author":"xcode","version":1}
          }
          EOF

          # 4. pbxproj patchen - relativen Pfad zum Asset Catalog berechnen
          PBXPROJ=$(ls -d *.xcodeproj/project.pbxproj | head -n 1)
          XCASSETS_DIR=$(dirname "$APPICONSET")
          REL_PATH=$(python3 -c "import os; print(os.path.relpath('$XCASSETS_DIR', '$(dirname $PBXPROJ)'))")
          
          echo "Asset Catalog Pfad: $REL_PATH"
          
          # Bestehende ASSETCATALOG-Einträge entfernen und neu setzen
          sed -i '' '/ASSETCATALOG_COMPILER_APPICON_NAME/d' "$PBXPROJ"
          sed -i '' "s|PRODUCT_NAME = \"firebird-emu\";|PRODUCT_NAME = \"firebird-emu\";\n\t\t\t\tASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;\n\t\t\t\tASSET_CATALOG_APP_ICON_SET_PATH = \"$REL_PATH\";|" "$PBXPROJ"

          echo "Icons erfolgreich ersetzt und pbxproj aktualisiert."

      - name: Build Qt Preprocess target first (generate all moc/rcc files)
        working-directory: build-ios
        run: |
          XCPROJ=$(ls -d *.xcodeproj | head -n 1)
          xcodebuild \
            -project "$XCPROJ" \
            -target "Qt Preprocess" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Build with xcodebuild (unsigned)
        working-directory: build-ios
        run: |
          XCPROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME=$(xcodebuild -project "$XCPROJ" -list -json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
          xcodebuild \
            -project "$XCPROJ" \
            -scheme  "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -UseModernBuildSystem=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            build \
            CONFIGURATION_BUILD_DIR="$(pwd)/output"

      # ── 6. Unsigned IPA packen ────────────────────────────────────────────
      - name: Package unsigned IPA
        working-directory: build-ios
        run: |
          APP=$(ls -d output/*.app | head -n 1)
          echo "App bundle: $APP"
          mkdir -p ipa-staging/Payload
          cp -R "$APP" ipa-staging/Payload/
          cd ipa-staging
          zip -r ../Firebird-unsigned.ipa Payload
          echo "IPA size: $(du -sh ../Firebird-unsigned.ipa | cut -f1)"

      # ── 7. Als Artifact hochladen ─────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Firebird-unsigned-IPA
          path: build-ios/Firebird-unsigned.ipa
          retention-days: 30
